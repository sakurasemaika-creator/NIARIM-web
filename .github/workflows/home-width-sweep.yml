# Final validation entry point for Home first-view geometry and Community preview.
name: Home width sweep

on:
  push:
    branches: [dev_branch]
    paths:
      - "tests/home-width-sweep.mjs"
      - "tests/home-community-spacing-audit.mjs"
      - "tests/home-responsive-visual-sweep.mjs"
      - ".github/workflows/home-width-sweep.yml"
      - "public/css/home-hero-viewport.css"
      - "public/css/home-hero-fidelity.css"
      - "public/css/home-hero-fit-628.css"
      - "public/css/home-hero-responsive-final.css"
      - "public/css/home-hero-cascade-final.css"
      - "public/css/line-break.css"
      - "public/css/home-community-spacing.css"
      - "public/css/pages/home.css"
      - "public/css/responsive-consistency.css"
      - "public/js/home-hero-showcase.js"
      - "public/js/config.js"
      - "public/js/config-links.js"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Audit Community preview and shared Home gutters
        run: node tests/home-community-spacing-audit.mjs
      - name: Capture responsive Home visual ladder
        if: always()
        run: node tests/home-responsive-visual-sweep.mjs
      - name: Capture progressive Home widths
        if: always()
        run: node tests/home-width-sweep.mjs
      - name: Export representative images for the audit review
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          root = Path('artifacts/autonomous-browser-audit/home-width-sweep')
          for name in ['responsive/home-hero-320x844.png', 'responsive/home-hero-390x844.png', 'home-1280x628.png']:
              image = root / name
              if image.exists():
                  print('AUDIT_IMAGE_BEGIN ' + name)
                  data = base64.b64encode(image.read_bytes()).decode('ascii')
                  for offset in range(0, len(data), 76):
                      print(data[offset:offset + 76])
                  print('AUDIT_IMAGE_END')
          PY
      - name: Upload width sweep PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-width-sweep
          path: artifacts/autonomous-browser-audit/home-width-sweep/
          if-no-files-found: error
          retention-days: 1
