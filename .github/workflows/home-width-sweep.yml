name: Home width sweep
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/home-width-sweep.yml"
      - "tests/modern-width-visual-audit.mjs"
      - "public/index.html"
      - "public/404.html"
      - "public/**/index.html"
      - "public/js/i18n-dict-refresh-2026.js"
      - "public/features/index.html"
      - "public/community/index.html"
      - "public/css/niarim-game-site.css"
      - "public/js/lang-flag.js"
      - "public/js/config.js"
      - "public/js/user-request-fixes.js"
      - "public/js/pc-paired-captures.js"
      - "public/assets/images/app-captures/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          python3 -m http.server 8787 --directory public >/tmp/niarim-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Audit all pages at eight widths and three key pages in seven languages
        run: node tests/modern-width-visual-audit.mjs
      - name: Publish top-to-bottom review, page metrics and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullsite-modern-width-visual-audit
          path: artifacts/modern-width-audit/
          if-no-files-found: warn
          retention-days: 14
