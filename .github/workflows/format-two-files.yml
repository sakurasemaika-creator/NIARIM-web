name: One-time two-file Prettier repair

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/format-two-files.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format changed audit files
        run: npx prettier --write public/js/home-hero-showcase.js tests/home-width-sweep.mjs
      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/home-hero-showcase.js tests/home-width-sweep.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format hero visual audit changes"
            git push origin HEAD:dev_branch
          fi
