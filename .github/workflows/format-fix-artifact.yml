name: Canonical Prettier output

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/format-fix-artifact.yml"
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            public/js/config-links.js \
            tests/final-visual-invariants-audit-v2.mjs \
            tests/home-community-spacing-audit.mjs \
            tests/home-responsive-visual-sweep.mjs
      - name: Collect formatted files
        run: |
          mkdir -p formatted/public/js formatted/tests
          cp public/js/config-links.js formatted/public/js/
          cp tests/final-visual-invariants-audit-v2.mjs formatted/tests/
          cp tests/home-community-spacing-audit.mjs formatted/tests/
          cp tests/home-responsive-visual-sweep.mjs formatted/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-prettier-output
          path: formatted/
          retention-days: 1
