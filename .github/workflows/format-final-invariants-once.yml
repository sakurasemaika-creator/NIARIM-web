name: One-time final invariant formatter

on:
  push:
    branches: [dev_branch]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/final-visual-invariants-audit-v2.mjs
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/final-visual-invariants-audit-v2.mjs
          git commit -m "style: format final invariant audit"
          git push origin HEAD:dev_branch
