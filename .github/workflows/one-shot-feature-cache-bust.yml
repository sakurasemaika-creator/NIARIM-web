name: One-shot feature asset cache bust
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-feature-cache-bust.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Bump feature asset versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          stamp='20260918-1'
          p=Path('public/features/index.html')
          s=p.read_text()
          s=s.replace('/js/lang-flag.js"','/js/lang-flag.js?v='+stamp+'"')
          s=s.replace('/js/main.js?v=20260917-2"','/js/main.js?v='+stamp+'"')
          p.write_text(s)

          p=Path('public/js/lang-flag.js')
          s=p.read_text().replace('/css/user-request-fixes.css?v=20260917-1','/css/user-request-fixes.css?v='+stamp).replace('/js/user-request-fixes.js?v=20260917-1','/js/user-request-fixes.js?v='+stamp)
          p.write_text(s)

          p=Path('public/js/main.js')
          s=p.read_text()
          for asset in ['polish.css','responsive-consistency.css','screen-mock-accuracy.css','screen-mock-palette.css','screen-mock-layout-fix.css','line-break.css']:
              s=s.replace('/css/'+asset+'"','/css/'+asset+'?v='+stamp+'"')
          p.write_text(s)
          PY
          grep -q '/js/lang-flag.js?v=20260918-1' public/features/index.html
          grep -q '/js/main.js?v=20260918-1' public/features/index.html
          grep -q '/css/user-request-fixes.css?v=20260918-1' public/js/lang-flag.js
          grep -q '/js/user-request-fixes.js?v=20260918-1' public/js/lang-flag.js
          grep -q '/css/screen-mock-layout-fix.css?v=20260918-1' public/js/main.js
          node --check public/js/main.js
          node --check public/js/lang-flag.js
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/features/index.html public/js/lang-flag.js public/js/main.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bust stale feature layout assets'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
