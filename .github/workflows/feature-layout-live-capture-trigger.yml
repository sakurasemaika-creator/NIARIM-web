name: Verify recovered feature mocks
on: push
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --check public/js/main.js
          test "$(wc -c < public/js/main.js)" -gt 51963
          grep -q 'feature-diagram-stack > .feature-diagram' public/js/main.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture deployed Features page
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const url = 'https://niarim-web.niarim.workers.dev/features/';
          let failed = false;
          for (const [name, width, height] of [['pc',1440,1000],['sp',390,844]]) {
            const page = await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            const r = await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            for (let y=0, h=await page.evaluate(()=>document.documentElement.scrollHeight); y<h; y+=Math.max(320,Math.floor(height*.7))) {
              await page.evaluate(v=>scrollTo(0,v),y); await page.waitForTimeout(120);
            }
            await page.evaluate(()=>scrollTo(0,0)); await page.waitForTimeout(400);
            await page.screenshot({path:`capture-${name}.png`,fullPage:true});
            const data=await page.evaluate(()=>({
              href:location.href,
              sections:[...document.querySelectorAll('.feature-section')].map(s=>{
                const pair=s.querySelector('.feature-pair');
                const copy=s.querySelector('.feature-copy-column');
                const stack=s.querySelector('.feature-diagram-stack');
                const mocks=[...s.querySelectorAll('.feature-diagram-stack .fd-app-screen,.feature-diagram-stack .fd-route-screen')];
                const cards=[...s.querySelectorAll('.spec-grid .spec-item')];
                const rect=e=>e?(()=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right}})():null;
                return {id:s.id,pair:rect(pair),copy:rect(copy),stack:rect(stack),mocks:mocks.map(rect),cards:cards.map(rect),opacity:getComputedStyle(s).opacity};
              })
            }));
            data.status=r?.status(); data.errors=errors;
            fs.writeFileSync(`geometry-${name}.json`,JSON.stringify(data,null,2));
            if (data.status!==200 || errors.length) failed=true;
            if (name==='pc') {
              for (const s of data.sections) {
                for (const m of s.mocks) {
                  const ratio=m.height/m.width;
                  if (m.width<180 || m.height<300 || ratio<1.55 || ratio>1.95) failed=true;
                }
                if (s.stack && s.copy && !(s.stack.x > s.copy.x)) failed=true;
              }
            }
            await page.close();
          }
          await browser.close();
          if (failed) process.exit(1);
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-feature-mocks
          path: |
            capture-*.png
            geometry-*.json
