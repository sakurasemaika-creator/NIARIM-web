name: Trigger live feature capture
on: push
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture deployed Features page and geometry
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const url = 'https://niarim-web.niarim.workers.dev/features/';
          for (const [name, width, height] of [['pc', 1440, 1000], ['sp', 390, 844]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            const consoleMessages = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', (msg) => consoleMessages.push(`${msg.type()}: ${msg.text()}`));
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('requestfailed', (request) => failedRequests.push(`${request.url()} :: ${request.failure()?.errorText ?? 'unknown'}`));
            const r = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            console.log(name, r?.status(), page.url());
            const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < pageHeight; y += Math.max(320, Math.floor(height * 0.7))) {
              await page.evaluate((scrollY) => window.scrollTo(0, scrollY), y);
              await page.waitForTimeout(80);
            }
            await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));
            await page.waitForTimeout(300);
            await page.screenshot({ path: `capture-${name}.png`, fullPage: true });
            const data = await page.evaluate(() => ({
              url: location.href,
              title: document.title,
              readyState: document.readyState,
              scripts: [...document.scripts].map((s) => ({ src: s.src, type: s.type, defer: s.defer, async: s.async })),
              nav: [...document.querySelectorAll('.main-nav a:not(.btn)')].map((e) => ({
                t: e.textContent.trim(),
                r: e.getBoundingClientRect().toJSON(),
                a: getComputedStyle(e).textAlign,
                j: getComputedStyle(e).justifyContent,
              })),
              sections: [...document.querySelectorAll('.feature-section')].map((s) => ({
                id: s.id,
                n: s.querySelector('.feature-narrative')?.getBoundingClientRect().toJSON(),
                stack: s.querySelector('.feature-diagram-stack')?.getBoundingClientRect().toJSON(),
                d: [...s.querySelectorAll('.feature-diagram-stack > .feature-diagram')].map((e) => ({
                  c: e.className,
                  r: e.getBoundingClientRect().toJSON(),
                  scroll: [e.scrollWidth, e.scrollHeight],
                  client: [e.clientWidth, e.clientHeight],
                  tr: getComputedStyle(e).transform,
                  childCount: e.childElementCount,
                  htmlLength: e.innerHTML.length,
                  text: e.textContent.trim().slice(0, 160),
                })),
                spec: s.querySelector('.spec-grid')?.getBoundingClientRect().toJSON(),
              })),
            }));
            data.consoleMessages = consoleMessages;
            data.pageErrors = pageErrors;
            data.failedRequests = failedRequests;
            fs.writeFileSync(`geometry-${name}.json`, JSON.stringify(data, null, 2));
            await page.close();
          }
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: feature-layout-live-capture
          path: |
            capture-*.png
            geometry-*.json
