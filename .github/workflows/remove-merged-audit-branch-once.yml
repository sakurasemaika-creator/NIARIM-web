name: Remove fully integrated audit branch (one-shot)
on:
  push:
    branches:
      - dev_branch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify audit branch is fully contained and delete it
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const stale = 'ccr-f56ee68e-77ag7y';
            const known = 'c65fa6eeaffac3a3c5664d5467c2f8d5fd999f75';
            let old;
            try {
              old = await github.rest.git.getRef({owner, repo, ref: `heads/${stale}`});
            } catch (error) {
              if (error.status === 404) {
                core.info('Audit branch already deleted.');
                return;
              }
              throw error;
            }
            if (old.data.object.sha !== known) {
              throw new Error('Audit branch changed since verification; refusing to delete it.');
            }
            const latest = await github.rest.git.getRef({owner, repo, ref: 'heads/dev_branch'});
            const comparison = await github.rest.repos.compareCommits({
              owner, repo, base: old.data.object.sha, head: latest.data.object.sha
            });
            if (comparison.data.behind_by !== 0 || !['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('Audit branch is not fully integrated; refusing deletion.');
            }
            await github.rest.git.deleteRef({owner, repo, ref: `heads/${stale}`});
            core.notice('Fully integrated audit branch deleted. main and dev_branch remain.');
