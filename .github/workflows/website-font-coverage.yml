name: Website font coverage (all Japanese pages)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/website-font-coverage.yml"
      - "tests/website-glyph-coverage-audit.mjs"
      - "public/**/*.html"
      - "public/css/**"
      - "public/js/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glyphs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve public site
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-font-site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-font-site.log
          exit 1
      - name: Inspect Japanese glyphs, mobile/desktop layout fonts, labels and footer
        env:
          FONT_AUDIT_STRICT: "1"
        run: node tests/website-glyph-coverage-audit.mjs
