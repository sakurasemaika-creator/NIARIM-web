name: One-time Prettier repair

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/format-repair.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier rules
        run: npx prettier --write . --ignore-unknown
      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: apply repository formatting"
            git push origin HEAD:dev_branch
          fi
