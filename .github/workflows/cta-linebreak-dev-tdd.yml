name: CTA Line Break Dev TDD
'on':
  push:
    branches:
      - dev_branch
    paths:
      - .github/workflows/cta-linebreak-dev-tdd.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Verify RED
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('public/js/i18n-dict.js').read_text()
          h=Path('public/index.html').read_text()
          assert '始められる。<br>全フレーム手描きでも' not in d
          assert 'data-i18n-html="cta.body"' not in h
          print('RED confirmed')
          PY
      - name: Apply requested line break
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='描きたいと思ったら今すぐにでも始められる。全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'
          new='描きたいと思ったら今すぐにでも始められる。<br>全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'
          p=Path('public/js/i18n-dict.js'); s=p.read_text(); assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('public/index.html'); s=p.read_text(); assert old in s; s=s.replace('data-i18n="cta.body"','data-i18n-html="cta.body"',1); s=s.replace(old,new.replace('<br>','<br />'),1); p.write_text(s)
          PY
          npx prettier --write public/js/i18n-dict.js public/index.html
      - name: Verify GREEN
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          d=Path('public/js/i18n-dict.js').read_text(); h=Path('public/index.html').read_text()
          assert '始められる。<br>全フレーム手描きでも' in d
          assert 'data-i18n-html="cta.body"' in h
          assert re.search(r'始められる。\s*<br\s*/?>\s*全フレーム手描きでも', h)
          print('GREEN confirmed')
          PY
          npm test
          npx prettier --check public/js/i18n-dict.js public/index.html
      - name: Commit verified change
        run: |
          git config user.name 'NIARIM Web UI Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/js/i18n-dict.js public/index.html
          git diff --cached --check
          git commit -m 'fix: break CTA body after opening sentence'
          git push origin HEAD:dev_branch
