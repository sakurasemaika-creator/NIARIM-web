name: Mock UI Source Fix Validation

on:
  push:
    branches:
      - fix/popup-close-frame-mode-20260914
    paths:
      - '.github/workflows/mock-ui-source-fix.yml'
      - 'tools/fix-mock-ui-structure.py'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/popup-close-frame-mode-20260914
          fetch-depth: 0
      - name: Apply exact mock UI fixes
        run: python3 tools/fix-mock-ui-structure.py
      - name: Verify source regression
        run: node tests/mock-ui-source-regression.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local site
        shell: bash
        run: |
          npm run dev > /tmp/niarim-web.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/niarim-web.log
          exit 1
      - name: Verify focused rendered mock UI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { launchOptions } from './tests/browser-launch.mjs';

          const browser = await chromium.launch(launchOptions());
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.goto('http://127.0.0.1:8787/', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForSelector('.fd-frame-mode-icon', { state: 'attached', timeout: 10000 });
          const result = await page.evaluate(() => ({
            legacyModeCount: document.querySelectorAll('.fd-frame-mode').length,
            iconModeCount: document.querySelectorAll('.fd-frame-mode-icon').length,
            topbarLeftCount: document.querySelectorAll('.fd-timeline-topbar-left').length,
            topbarRightCount: document.querySelectorAll('.fd-timeline-topbar-right').length,
          }));
          await browser.close();
          if (result.legacyModeCount !== 0 || result.iconModeCount < 1 || result.topbarLeftCount < 1 || result.topbarRightCount < 1) {
            console.error(result);
            process.exit(1);
          }
          console.log('focused-rendered-mock-ui: ok', result);
          NODE
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'NIARIM UI Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/js/main.js public/css/screen-mock-accuracy-base.css tests/mock-ui-source-regression.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: align mock switches and popup close placement'
          git push origin HEAD:fix/popup-close-frame-mode-20260914
