name: One-shot Popup Outside Dismiss

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-popup-outside-dismiss.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Write focused outside-dismiss contract
        shell: bash
        run: |
          cat > tests/popup-outside-dismiss-contract.mjs <<'EOF'
          import fs from "node:fs/promises";

          const [behavior, home, features, css] = await Promise.all([
            fs.readFile("public/js/popup-mock-interactions.js", "utf8").catch(() => ""),
            fs.readFile("public/index.html", "utf8"),
            fs.readFile("public/features/index.html", "utf8"),
            fs.readFile("public/css/popup-close-affordance.css", "utf8"),
          ]);

          const failures = [];
          const expect = (value, message) => {
            if (!value) failures.push(message);
          };

          expect(
            behavior.includes('document.addEventListener("click"') &&
              behavior.includes('.fd-panel-close-bar') &&
              behavior.includes('.fd-canvas-screen') &&
              behavior.includes('.fd-app-overlay-panel') &&
              behavior.includes('panel.contains(target)') &&
              behavior.includes('panel.classList.add("is-dismissed")'),
            "Screen mocks must dismiss the floating tool panel from the close affordance or an outside canvas tap without dismissing from an inside-panel tap",
          );
          expect(
            css.includes('.fd-app-overlay-panel.is-dismissed') &&
              css.includes('display: none !important'),
            "Dismissed mock panels must be hidden by the final popup parity layer",
          );
          for (const [name, html] of [["home", home], ["features", features]]) {
            expect(
              html.includes('<script src="/js/main.js"></script>') &&
                html.includes('<script src="/js/popup-mock-interactions.js"></script>') &&
                html.indexOf('/js/popup-mock-interactions.js') > html.indexOf('/js/main.js'),
              `${name} must load delegated popup interactions after main.js`,
            );
          }

          if (failures.length) {
            console.error(JSON.stringify({ ok: false, failures }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ ok: true }, null, 2));
          EOF

      - name: Verify RED
        shell: bash
        run: |
          set +e
          node tests/popup-outside-dismiss-contract.mjs >/tmp/popup-red.log 2>&1
          status=$?
          set -e
          cat /tmp/popup-red.log
          test "$status" -ne 0
          grep -q 'Screen mocks must dismiss' /tmp/popup-red.log

      - name: Add delegated mock interaction
        shell: bash
        run: |
          cat > public/js/popup-mock-interactions.js <<'EOF'
          /** App-parity interactions for floating Canvas tool-panel reconstructions. */
          (function () {
            "use strict";

            function dismiss(panel) {
              if (panel) panel.classList.add("is-dismissed");
            }

            document.addEventListener("click", function (event) {
              var target = event.target;
              if (!(target instanceof Element)) return;

              var close = target.closest(".fd-panel-close-bar");
              if (close) {
                dismiss(close.closest(".fd-app-overlay-panel"));
                return;
              }

              var screen = target.closest(".fd-canvas-screen");
              if (!screen) return;

              var panel = screen.querySelector(
                ".fd-app-overlay-panel:not(.is-dismissed)",
              );
              if (!panel || panel.contains(target)) return;
              dismiss(panel);
            });
          })();
          EOF

          cat >> public/css/popup-close-affordance.css <<'EOF'

          /* Match CanvasScreen's transparent outside-tap barrier: interactions
             inside the floating panel stay open; tapping the surrounding mock
             canvas dismisses only the active floating tool panel. */
          html body .fd-app-overlay-panel.is-dismissed {
            display: none !important;
          }
          EOF

          python3 <<'PY'
          from pathlib import Path
          for name in ("public/index.html", "public/features/index.html"):
              path = Path(name)
              text = path.read_text()
              needle = '    <script src="/js/main.js"></script>\n'
              addition = needle + '    <script src="/js/popup-mock-interactions.js"></script>\n'
              if '/js/popup-mock-interactions.js' not in text:
                  if needle not in text:
                      raise SystemExit(f"main.js marker missing in {name}")
                  text = text.replace(needle, addition, 1)
              path.write_text(text)
          PY

      - name: Verify GREEN and formatting
        run: |
          node tests/popup-outside-dismiss-contract.mjs
          node tests/popup-close-affordance-contract.mjs
          npx prettier --write public/js/popup-mock-interactions.js public/css/popup-close-affordance.css public/index.html public/features/index.html tests/popup-outside-dismiss-contract.mjs tests/popup-close-affordance-contract.mjs
          node tests/popup-outside-dismiss-contract.mjs
          node tests/popup-close-affordance-contract.mjs
          npx prettier --check public/js/popup-mock-interactions.js public/css/popup-close-affordance.css public/index.html public/features/index.html tests/popup-outside-dismiss-contract.mjs tests/popup-close-affordance-contract.mjs

      - name: Commit verified product change and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-popup-outside-dismiss.yml
          git add public/js/popup-mock-interactions.js public/css/popup-close-affordance.css public/index.html public/features/index.html tests/popup-outside-dismiss-contract.mjs tests/popup-close-affordance-contract.mjs
          git diff --cached --check
          git commit -m "fix: dismiss mock tool panels from outside tap"
          git pull --rebase origin dev_branch
          node tests/popup-outside-dismiss-contract.mjs
          node tests/popup-close-affordance-contract.mjs
          git push origin HEAD:dev_branch
