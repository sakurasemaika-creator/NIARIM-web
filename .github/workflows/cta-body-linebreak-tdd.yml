name: CTA Body Line Break TDD
'on':
  push:
    branches:
      - fix/web-final-work
    paths:
      - .github/workflows/cta-body-linebreak-tdd.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-final-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify RED
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('public/js/lang-flag.js').read_text()
          wanted='始められる。<br>全フレーム手描きでも'
          if wanted in src:
              raise SystemExit('Expected RED but requested break already exists')
          print('RED confirmed: requested CTA break is absent')
          PY
      - name: Apply requested break
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='描きたいと思ったら今すぐにでも始められる。全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'
          new='描きたいと思ったら今すぐにでも始められる。<br>全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'
          p=Path('public/js/lang-flag.js'); s=p.read_text()
          if old not in s: raise SystemExit('CTA body source not found')
          p.write_text(s.replace(old,new,1))
          for name in ('public/index.html','public/faq/index.html'):
              p=Path(name); s=p.read_text()
              s=s.replace('data-i18n="cta.body"','data-i18n-html="cta.body"')
              s=s.replace(old,new.replace('<br>','<br />'))
              p.write_text(s)
          PY
          npx prettier --write public/js/lang-flag.js public/index.html public/faq/index.html
      - name: Verify GREEN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert '始められる。<br>全フレーム手描きでも' in Path('public/js/lang-flag.js').read_text()
          for name in ('public/index.html','public/faq/index.html'):
              s=Path(name).read_text()
              assert 'data-i18n-html="cta.body"' in s
              assert '始められる。<br />全フレーム手描きでも' in s
          print('CTA line-break contract: ok')
          PY
          node tests/mock-ui-source-regression.mjs
      - name: Commit verified change
        run: |
          git config user.name 'NIARIM Web UI Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/js/lang-flag.js public/index.html public/faq/index.html
          git diff --cached --check
          git commit -m 'fix: add requested CTA body line break'
          git push origin HEAD:fix/web-final-work