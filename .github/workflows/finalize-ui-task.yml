name: Finalize UI Task
on:
  push:
    branches: [fix/web-final-work]
    paths: ['.github/workflows/finalize-ui-task.yml']
permissions:
  contents: write
jobs:
  fix-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-final-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: RED - requested narrative break is absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('public/js/i18n-dict-narrative.js').read_text()
          h=Path('public/index.html').read_text()
          assert '始められる。<br>全フレーム手描きでも' not in d
          assert 'data-i18n-html="narrative.home.cta.body"' not in h
          print('RED confirmed')
          PY
      - name: Implement requested narrative copy and line break
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='描きたいと思ったら、すぐに始められる。一枚の絵からでも、何十枚ものフレームを使った作品でも。手描きで動かす。キーフレームで動かす。画像や音を組み合わせる。仕上げまでこだわって、自分だけの作品にする。そして完成したら、「作品広場」へ。つくって、公開して、みつけよう。NIARIMで、アニメーションをつくってみよう！'
          new='描きたいと思ったら今すぐにでも始められる。<br>全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'
          p=Path('public/js/i18n-dict-narrative.js'); s=p.read_text(); assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('public/index.html'); s=p.read_text(); assert old in s; s=s.replace('data-i18n="narrative.home.cta.body"','data-i18n-html="narrative.home.cta.body"',1); s=s.replace(old,new.replace('<br>','<br />'),1); p.write_text(s)
          PY
          npx prettier --write public/js/i18n-dict-narrative.js public/index.html
      - name: GREEN - verify narrative break and regressions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          d=Path('public/js/i18n-dict-narrative.js').read_text()
          h=Path('public/index.html').read_text()
          assert '始められる。<br>全フレーム手描きでも' in d
          assert 'data-i18n-html="narrative.home.cta.body"' in h
          assert re.search(r'始められる。\s*<br\s*/?>\s*全フレーム手描きでも', h)
          print('GREEN confirmed')
          PY
          node tests/mock-ui-source-regression.mjs
          npx prettier --check public/js/i18n-dict-narrative.js public/index.html
      - name: Commit verified change
        run: |
          git config user.name 'NIARIM Web UI Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/js/i18n-dict-narrative.js public/index.html
          git diff --cached --check
          git commit -m 'fix: add requested narrative CTA line break'
          git push origin HEAD:fix/web-final-work
