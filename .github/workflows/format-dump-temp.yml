name: Temporary format dump
on:
  push:
    branches: [dev_branch]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format and dump
        run: |
          npx prettier --write tests/all-pages-responsive-quality-audit.mjs
          echo '---BEGIN-FORMATTED-BASE64---'
          base64 -w0 tests/all-pages-responsive-quality-audit.mjs
          echo
          echo '---END-FORMATTED-BASE64---'
