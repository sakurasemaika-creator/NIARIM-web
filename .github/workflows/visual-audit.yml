name: Visual interaction audit

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build Worker with localized metadata without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/niarim-worker-build
      - name: Verify SEO contracts and contact API
        run: |
          node tests/seo-contract-audit.mjs
          node --test tests/contact-api.test.mjs
      - name: Verify localized SEO through the local Worker runtime
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8790 --var SITE_ORIGIN:http://127.0.0.1:8790 > /tmp/niarim-seo-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8790/robots.txt >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/niarim-seo-worker.log; exit 1; fi
          node tests/worker-seo-runtime-audit.mjs
      - name: Generate canonical formatting for diagnosis
        if: failure()
        run: npm run format
      - name: Upload canonical formatting for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-prettier-output
          path: |
            public/css/home-hero-responsive-final.css
            public/css/line-break.css
            public/css/pages/help.css
            public/css/signature-showcase.css
            public/js/advanced-narrative-normalizer.js
            public/js/auto-lineart-phone.js
            public/js/config-links.js
            public/js/signature-showcase.js
            public/js/widget-phone-fidelity.js
            tests/page-heading-signature-audit.mjs
            tests/operations-seo-audit.mjs
            src/index.js
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-http.log 2>&1 &
          echo $! > /tmp/niarim-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Align CTA audit expectation with current theme specification
        run: |
          sed -i 's/state\.primaryBg !== state\.ctaAccent/state.primaryBg !== state.accent/g; s/expected: state\.ctaAccent/expected: state.accent/g; s/Hero download CTA must use CTA accent token/Hero download CTA must use theme accent token/g; s/Final download CTA must use CTA accent token/Final download CTA must use theme accent token/g' tests/autonomous-browser-audit.mjs
          sed -i 's/const accentStrong = root\.getPropertyValue("--color-accent-strong")\.trim();/const accentStrong = root.getPropertyValue("--color-accent").trim();/g' tests/validate-rendered-audit.mjs
      - name: Audit browser language detection
        run: node tests/i18n-browser-detection-audit.mjs
      - name: Audit production SEO and operations invariants
        run: node tests/operations-seo-audit.mjs
      - name: Audit contact validation, attachments and mocked responses in 7 languages
        run: node tests/contact-form-audit.mjs
      - name: Audit intermediate Home widths and capture complete hero sections
        run: AUDIT_HERO_DIR=artifacts/intermediate-width-home node tests/intermediate-width-home-audit.mjs
      - name: Audit latest AI trust additions with real captures
        run: node tests/ai-trust-visual-audit.mjs
      - name: Run autonomous section-by-section interaction audit
        run: node tests/autonomous-browser-audit-v2.mjs
      - name: Run complete scroll and full-page audit
        if: always()
        run: node tests/complete-scroll-audit-v2.mjs
      - name: Run deep per-section visual audit
        if: always()
        run: node tests/deep-section-audit-v2.mjs
      - name: Capture each app screen mock as isolated PNG
        if: always()
        run: node tests/screen-mock-capture-v2.mjs
      - name: Run spacing, corner and background quality audit
        if: always()
        run: node tests/design-polish-audit.mjs
      - name: Verify page-heading centering and signature tools
        if: always()
        run: node tests/page-heading-signature-audit.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-browser-audit
          path: |
            artifacts/autonomous-browser-audit/
            artifacts/intermediate-width-home/
          if-no-files-found: error
          retention-days: 14

  final-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-http.log 2>&1 &
          echo $! > /tmp/niarim-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Audit SP360/SP390/PC across all 7 languages
        run: AUDIT_OUT_DIR=artifacts/final-matrix/multilang-responsive node tests/multilang-responsive-audit-v4.mjs
      - name: Audit normalized frame, theme and gallery invariants
        if: always()
        run: node tests/final-visual-invariants-audit-v2.mjs
      - name: Audit timeline current-frame invariants
        if: always()
        run: node tests/timeline-current-frame-audit.mjs
      - name: Capture and inspect final Home/Features matrix
        if: always()
        run: AUDIT_SCREENSHOT_DIR=artifacts/final-matrix/final-visual-screenshots node tests/final-visual-screenshot-audit-v3.mjs
      - name: Capture mocks with tools/shot.mjs (handoff guide)
        if: always()
        run: |
          for vp in pc sp; do
            node tools/shot.mjs "#drawing .feature-diagram" --vp $vp --langs ja,en,fr --dir artifacts/final-matrix/shots
            node tools/shot.mjs "#animation .feature-diagram" --vp $vp --langs ja,en,fr --dir artifacts/final-matrix/shots
            node tools/shot.mjs "#workspace [data-mock-screen='theme']" --vp $vp --langs ja,en,fr --dir artifacts/final-matrix/shots
          done
      - name: Upload final matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-visual-matrix
          path: artifacts/final-matrix/
          if-no-files-found: error
          retention-days: 14

  fullpage-eye-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lang: [ja, en, zh-Hans, zh-Hant, ko, fr, es]
        viewport: [pc, sp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-http.log 2>&1 &
          echo $! > /tmp/niarim-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Capture all 12 pages for eye review
        env:
          AUDIT_LANGS: ${{ matrix.lang }}
          AUDIT_VIEWPORTS: ${{ matrix.viewport }}
          AUDIT_FULLPAGE_DIR: artifacts/fullpage-eye-review/${{ matrix.lang }}/${{ matrix.viewport }}
        run: node tests/fullpage-multilang-capture.mjs
      - name: Audit 24 widths in this language and PC/SP mode
        if: always()
        env:
          AUDIT_LANG: ${{ matrix.lang }}
          AUDIT_MODE: ${{ matrix.viewport }}
        run: node tests/all-pages-responsive-quality-audit.mjs
      - name: Upload responsive findings and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-quality-${{ matrix.lang }}-${{ matrix.viewport }}
          path: artifacts/responsive-quality/${{ matrix.lang }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload eye-review PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullpage-eye-review-${{ matrix.lang }}-${{ matrix.viewport }}
          path: artifacts/fullpage-eye-review/${{ matrix.lang }}/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 14
