name: Hero boundary PNG review

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/hero-boundary-png-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Capture and verify all Hero boundary states
        run: AUDIT_HERO_DIR=artifacts/intermediate-width-home node tests/intermediate-width-home-audit.mjs
      - name: Upload Hero PNG evidence
        uses: actions/upload-artifact@v4
        with:
          name: hero-boundary-png-review
          path: artifacts/intermediate-width-home/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary workflow without overwriting concurrent work
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hero-boundary-png-review.yml
          git commit -m 'ci: remove temporary Hero PNG review workflow'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
