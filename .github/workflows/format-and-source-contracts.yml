name: Format and source contracts
on:
  push:
    branches: [dev_branch]
  pull_request:
    branches: [dev_branch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prettier formatting
        run: npm run format:check
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Source contracts
        run: |
          npm run audit:brand-direction
          npm run audit:opal
          npm run audit:font-capture
          node tests/studio-2026-contract.mjs
          node tests/studio-heading-glyph-contract.mjs
          node tests/home-cta-frame-mode-source-contract.mjs
          node tests/screen-mock-i18n-key-leak-contract.mjs
      - name: Worker bundle
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/niarim-worker-build"
