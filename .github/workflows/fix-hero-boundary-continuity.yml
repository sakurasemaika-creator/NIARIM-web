name: Repair Hero boundary continuity

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/fix-hero-boundary-continuity.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply boundary and cascade repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          final_link = '    <link rel="stylesheet" href="/css/home-hero-responsive-final.css" />\n'
          if final_link not in text:
              anchor = '    <link rel="stylesheet" href="/css/pages/features.css" />\n'
              if text.count(anchor) != 1:
                  raise SystemExit('Home stylesheet anchor changed')
              text = text.replace(anchor, anchor + final_link, 1)
          index.write_text(text)

          css = Path('public/css/home-hero-responsive-final.css')
          text = css.read_text()
          text = text.replace(
              '@media (min-width: 560px) and (max-width: 759px) {',
              '@media (min-width: 560px) and (max-width: 732px) {',
              1,
          )
          old = '''  html body .hero-visual,
          html body .hero-showcase {
            grid-column: 2 !important;
            grid-row: auto !important;
            /* Grow the single-card presentation continuously through the compact band.
               Ending near 243px at 759px keeps its visual weight close to the two-card
               tablet presentation instead of making 760px look like a different page. */
            width: clamp(160px, 32vw, 245px) !important;
            max-width: 245px !important;'''
          new = '''  html body .hero-visual,
          html body .hero-showcase {
            grid-column: 2 !important;
            grid-row: auto !important;
            width: clamp(150px, 28vw, 205px) !important;
            max-width: 205px !important;'''
          if old not in text:
              raise SystemExit('compact visual anchor changed')
          text = text.replace(old, new, 1)

          transition = '''
          /* 733–759px is a deliberate transition band: keep one preview card, but
             let it grow before the two-card tablet composition begins at 760px. */
          @media (min-width: 733px) and (max-width: 759px) {
            html body .hero {
              padding-top: clamp(1.75rem, 4vw, 2.25rem) !important;
              padding-bottom: clamp(1.6rem, 3.6vw, 2.05rem) !important;
            }

            html body .hero .container {
              width: calc(100% - 2rem) !important;
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) minmax(210px, 0.72fr) !important;
              grid-template-rows: none !important;
              align-items: center !important;
              justify-items: stretch !important;
              gap: clamp(1rem, 2.6vw, 1.5rem) !important;
            }

            html body .hero-copy {
              display: flex !important;
              flex-direction: column !important;
              align-items: flex-start !important;
              width: 100% !important;
              min-width: 0 !important;
              grid-column: 1 !important;
              grid-row: auto !important;
            }

            html body .hero-visual,
            html body .hero-showcase {
              grid-column: 2 !important;
              grid-row: auto !important;
              width: clamp(210px, 32vw, 243px) !important;
              max-width: 243px !important;
              min-width: 0 !important;
              justify-self: end !important;
              align-self: center !important;
              margin-inline: 0 !important;
            }

            html body .hero-title {
              max-width: 100% !important;
              font-size: clamp(2.2rem, 5.8vw, 2.85rem) !important;
              line-height: 1 !important;
            }

            html body .hero-subtitle {
              margin-top: 0.65rem !important;
              font-size: clamp(0.9rem, 1.8vw, 0.98rem) !important;
            }

            html body .hero-lead {
              margin-top: 0.8rem !important;
              max-width: none !important;
              font-size: clamp(0.84rem, 1.55vw, 0.93rem) !important;
              line-height: 1.6 !important;
            }

            html body .hero-actions {
              margin-top: 0.9rem !important;
              gap: 0.5rem !important;
              flex-wrap: wrap !important;
            }

            html body .hero-actions .btn {
              min-width: 0 !important;
              min-height: 44px !important;
              padding: 0.64rem 0.85rem !important;
              flex: 1 1 9.5rem !important;
            }

            html body .hero-bridge {
              display: block !important;
              margin-top: 0.7rem !important;
              max-width: none !important;
              font-size: 0.76rem !important;
              line-height: 1.5 !important;
            }
          }

          '''
          tablet_anchor = '@media (min-width: 760px) and (max-width: 1023px) {'
          if transition.strip() not in text:
              if text.count(tablet_anchor) != 1:
                  raise SystemExit('tablet media anchor changed')
              text = text.replace(tablet_anchor, transition + tablet_anchor, 1)

          text = text.replace(
              'grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr) !important;',
              'grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr) !important;',
              1,
          )
          text = text.replace(
              'width: clamp(300px, 39vw, 424px) !important;',
              'width: clamp(320px, 41.5vw, 424px) !important;',
              1,
          )
          css.write_text(text)

          audit = Path('tests/intermediate-width-home-audit.mjs')
          text = audit.read_text()
          text = text.replace('700, 732, 759, 760, 768, 834', '700, 732, 733, 759, 760, 768, 834', 1)
          text = text.replace('} else if (width <= 759) {', '} else if (width <= 732) {', 1)
          tablet = '''    } else if (width <= 1023) {'''
          transition_check = '''    } else if (width <= 759) {
              if (trackCount < 2) {
                failures.push({
                  id,
                  kind: "transition-hero-lost-two-column-layout",
                  state,
                });
              }
              if (overlaps(state.copy, state.visual)) {
                failures.push({ id, kind: "transition-columns-collision", state });
              }
              if (copyVisualGap !== null && copyVisualGap < 12) {
                failures.push({
                  id,
                  kind: "transition-columns-too-tight",
                  copyVisualGap,
                  state,
                });
              }
              if (state.visual.width < 210 || state.visual.width > 245) {
                failures.push({ id, kind: "transition-visual-size-outlier", state });
              }
              if (state.visualOwner === "showcase" && state.visibleCards.length !== 1) {
                failures.push({ id, kind: "transition-showcase-card-count", state });
              }
              if (state.paddingTop > 38 || state.paddingBottom > 36) {
                failures.push({ id, kind: "transition-padding-too-loose", state });
              }
            } else if (width <= 1023) {'''
          if text.count(tablet) != 1:
              raise SystemExit('tablet audit anchor changed')
          text = text.replace(tablet, transition_check, 1)
          marker = '''    if (previous?.width === 759 && width === 760) {'''
          boundary = '''    if (previous?.width === 732 && width === 733) {
              if (ratioJump(previous.state.visual.width, state.visual.width) > 0.2) {
                failures.push({
                  id,
                  kind: "732-733-visual-density-jump",
                  previous: previous.state,
                  state,
                });
              }
            }
            if (previous?.width === 759 && width === 760) {'''
          if text.count(marker) != 1:
              raise SystemExit('759 boundary audit anchor changed')
          text = text.replace(marker, boundary, 1)
          audit.write_text(text)
          PY

      - name: Format touched files
        run: npx prettier --write public/index.html public/css/home-hero-responsive-final.css tests/intermediate-width-home-audit.mjs

      - name: Check touched file formatting
        run: npx prettier --check public/index.html public/css/home-hero-responsive-final.css tests/intermediate-width-home-audit.mjs

      - name: Commit repair without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-hero-boundary-continuity.yml
          git add public/index.html public/css/home-hero-responsive-final.css tests/intermediate-width-home-audit.mjs
          git commit -m 'fix: make Hero breakpoint transition continuous'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
