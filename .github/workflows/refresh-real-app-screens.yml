name: Refresh real app screenshots
# Imports the latest successful premium capture artifact from the app repository.
# Refresh trigger: distinct-theme premium references.
on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/refresh-real-app-screens.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - name: Install image encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin imagemagick
      - name: Download latest successful premium app captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _app/build/visual-smoke
          run_json="$(gh api 'repos/sakurasemaika-creator/NIARIM/actions/workflows/web-reference-capture.yml/runs?branch=dev_branch&status=success&per_page=1')"
          run_id="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].id // empty')"
          run_sha="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].head_sha // empty')"
          app_head="$(gh api 'repos/sakurasemaika-creator/NIARIM/branches/dev_branch' --jq '.commit.sha')"
          test -n "$run_id"
          if [ "$run_sha" != "$app_head" ]; then
            compare="$(gh api "repos/sakurasemaika-creator/NIARIM/compare/$run_sha...$app_head")"
            ui_changes="$(printf '%s' "$compare" | jq '[.files[]?.filename | select(startswith("lib/") or startswith("test/app_web_reference_capture"))] | length')"
            if [ "$ui_changes" != "0" ]; then
              echo "::error::Latest successful capture ($run_sha) predates relevant app UI/capture changes at $app_head"
              exit 1
            fi
            echo "Using capture $run_sha: newer app commits contain no lib/ or web-reference-capture changes."
          fi
          gh run download "$run_id" -R sakurasemaika-creator/NIARIM -n web-reference-captures -D _app/build/visual-smoke
          echo "APP_CAPTURE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Build lightweight web assets
        run: |
          set -euo pipefail
          src="_app/build/visual-smoke"
          dst="public/assets/images/app-captures"
          mkdir -p "$dst"
          declare -A map=([01_canvas_default]=canvas [02_canvas_layer_panel]=layers [03_canvas_onion_skin]=onion-skin [04_timeline_default]=timeline [05_timeline_audio_editor]=audio-editor [06_save_tree]=save-tree [07_export]=export [08_workspace]=workspace)
          for key in "${!map[@]}"; do
            name="${map[$key]}"
            for variant in 1 2 3 4; do
              suffix=""; out_suffix=""
              if [ "$variant" != "1" ]; then suffix="_v$variant"; out_suffix="-v$variant"; fi
              png="$src/webref_${key}$suffix.png"
              test -f "$png"
              cwebp -quiet -q 78 -m 6 "$png" -o "$dst/$name$out_suffix.webp"
              avifenc --min 24 --max 34 --speed 6 "$png" "$dst/$name$out_suffix.avif" >/dev/null
              dims="$(identify -format '%wx%h' "$dst/$name$out_suffix.webp" 2>/dev/null || true)"
              if [ "$dims" != "320x569" ]; then
                echo "::error::$name$out_suffix.webp must remain 320x569, got ${dims:-unknown}"
                exit 1
              fi
            done
          done
          printf 'source_repo=sakurasemaika-creator/NIARIM\nsource_branch=dev_branch\nsource_commit=%s\ncaptured_at=%s\n' "$(sed -n 's/^commit=//p' _app/build/visual-smoke/webref_capture_metadata.txt | head -n1)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$dst/source.txt"
          du -h "$dst"/*
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/app-captures
          git diff --cached --quiet && exit 0
          git commit -m "assets: refresh real NIARIM app captures"
          git push origin HEAD:dev_branch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-captures
          path: |
            _app/build/visual-smoke/webref_*.png
            public/assets/images/app-captures/*
          retention-days: 14
