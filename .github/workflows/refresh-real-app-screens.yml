name: Refresh real app screenshots from current NIARIM dev_branch
# One production-Flutter capture per app screen, four uniquely themed premium variants.
# Every image must come from the current app branch; do not publish outdated captures.
on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/refresh-real-app-screens.yml"
      - "public/index.html"
      - "public/features/index.html"
      - "public/css/refresh-2026.css"
      - "public/js/refresh-2026.js"
permissions:
  contents: write
concurrency:
  group: refresh-real-app-screens
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 1
      - name: Checkout current NIARIM app source
        run: |
          git clone --depth 1 --single-branch --branch dev_branch https://github.com/sakurasemaika-creator/NIARIM.git _app
          echo "APP_CAPTURE_SHA=$(git -C _app rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Install capture fonts and encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk webp libavif-bin imagemagick
          fc-cache -f
      - name: Check matching screen-frame themes against app source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dart=fs.readFileSync('_app/test/app_web_reference_capture_test_v2.dart','utf8');
          const match=dart.match(/const webCaptureAccents = <Color>\[([\s\S]*?)\];/);
          if(!match) throw Error('Cannot find app capture theme catalog');
          const app=[...match[1].matchAll(/Color\(0xFF([0-9A-Fa-f]{6})\)/g)].map(m=>'#'+m[1].toUpperCase());
          const js=fs.readFileSync('public/js/refresh-2026.js','utf8');
          const expectedMatch=js.match(/var colors=([\s\S]*?\];)/);
          if(!expectedMatch)throw Error('Cannot find web gallery theme catalog');
          const expected=JSON.parse(expectedMatch[1].replace(/;$/,'')).flat();
          if(app.length!==36||JSON.stringify(app)!==JSON.stringify(expected)){
            throw Error('App theme accents and website screenshot frame colors differ');
          }
          console.log('Verified all 36 app accent colors against website gallery');
          NODE
      - name: Generate latest premium app images, without advertisements
        working-directory: _app
        env:
          CI: "true"
        run: |
          flutter pub get
          flutter test test/app_web_reference_capture_test_v2.dart --reporter expanded
      - name: Convert nine screens times four themed variants
        run: |
          set -euo pipefail
          src="_app/build/visual-smoke"
          dst="public/assets/images/app-captures"
          mkdir -p "$dst"
          declare -A mapping=(
            [01_canvas_default]=canvas
            [02_canvas_layer_panel]=layers
            [03_canvas_onion_skin]=onion-skin
            [04_timeline_default]=timeline
            [05_timeline_audio_editor]=audio-editor
            [06_save_tree]=save-tree
            [07_export]=export
            [08_workspace]=workspace
            [09_widget]=widget
          )
          total=0
          for key in "${!mapping[@]}"; do
            name="${mapping[$key]}"
            for variant in 1 2 3 4; do
              suffix="" ; dest=""
              if [ "$variant" != 1 ]; then suffix="_v$variant"; dest="-v$variant"; fi
              png="$src/webref_${key}${suffix}.png"
              test -s "$png" || { echo "::error::Missing capture $png"; exit 1; }
              cwebp -quiet -q 83 -m 6 "$png" -o "$dst/$name$dest.webp"
              avifenc --min 20 --max 30 --speed 6 "$png" "$dst/$name$dest.avif" > /dev/null
              test "$(identify -format '%wx%h' "$dst/$name$dest.webp")" = "320x569" || {
                echo "::error::Capture dimension mismatch for $name$dest"; exit 1;
              }
              total=$((total+1))
            done
          done
          test "$total" = 36
          printf 'source_repo=sakurasemaika-creator/NIARIM\nsource_branch=dev_branch\nsource_commit=%s\ncaptured_at=%s\npremium=true\nads=false\nvariants_per_screen=4\nscreens=9\n' "$APP_CAPTURE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$dst/source.txt"
          revision="$(printf '%s' "$APP_CAPTURE_SHA" | cut -c1-8)"
          sed -E -i "s/var revision = \"[0-9a-f]+\";/var revision = \"$revision\";/" public/js/user-request-fixes.js
          sed -E -i "s/var revision = \"[0-9a-f]+\";/var revision = \"$revision\";/" public/js/home-hero-showcase.js
          echo "Generated $total premium, ad-free, themed app captures from $APP_CAPTURE_SHA"
      - name: Publish captures only to dev_branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/app-captures public/js/user-request-fixes.js public/js/home-hero-showcase.js
          if git diff --cached --quiet; then echo 'Screens are already current'; exit 0; fi
          git commit -m "assets: refresh 36 real premium captures from NIARIM dev_branch"
          git fetch origin dev_branch
          git rebase origin/dev_branch || { git rebase --abort; echo "::error::Conflicting parallel changes; no force push performed"; exit 1; }
          git push origin HEAD:dev_branch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niarim-premium-ad-free-current-app-captures
          path: |
            _app/build/visual-smoke/webref_*.png
            public/assets/images/app-captures/source.txt
          if-no-files-found: warn
          retention-days: 14
