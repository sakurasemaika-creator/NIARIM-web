name: Refresh real app screenshots
on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/refresh-real-app-screens.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - name: Install image encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin imagemagick
      - name: Download latest successful premium app captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _app/build/visual-smoke
          run_id="$(gh api 'repos/sakurasemaika-creator/NIARIM/actions/workflows/web-reference-capture.yml/runs?branch=dev_branch&status=success&per_page=1' --jq '.workflow_runs[0].id')"
          test -n "$run_id"
          gh run download "$run_id" -R sakurasemaika-creator/NIARIM -n web-reference-captures -D _app/build/visual-smoke
          echo "APP_CAPTURE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Build lightweight web assets
        run: |
          set -euo pipefail
          src="_app/build/visual-smoke"
          dst="public/assets/images/app-captures"
          mkdir -p "$dst"
          declare -A map=([01_canvas_default]=canvas [02_canvas_layer_panel]=layers [03_canvas_onion_skin]=onion-skin [04_timeline_default]=timeline [05_timeline_audio_editor]=audio-editor [06_save_tree]=save-tree [07_export]=export [08_workspace]=workspace)
          for key in "${!map[@]}"; do
            png="$src/webref_${key}.png"; [ -f "$png" ] || continue
            name="${map[$key]}"
            # Preserve the exact premium reference-capture canvas. Cropping or
            # trimming changes intrinsic geometry and makes the website frame diverge.
            cwebp -quiet -q 78 -m 6 "$png" -o "$dst/$name.webp"
            avifenc --min 24 --max 34 --speed 6 "$png" "$dst/$name.avif" >/dev/null
          done
          for required in canvas timeline layers onion-skin audio-editor save-tree export workspace; do
            test -f "$dst/$required.webp"
            test -f "$dst/$required.avif"
            dims="$(identify -format '%wx%h' "$dst/$required.webp" 2>/dev/null || true)"
            if [ "$dims" != "320x569" ]; then
              echo "::error::$required.webp must remain 320x569, got ${dims:-unknown}"
              exit 1
            fi
          done
          printf 'source_repo=sakurasemaika-creator/NIARIM\nsource_branch=dev_branch\nsource_commit=%s\ncaptured_at=%s\n' "$(sed -n 's/^commit=//p' _app/build/visual-smoke/webref_capture_metadata.txt | head -n1)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$dst/source.txt"
          du -h "$dst"/*
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/app-captures
          git diff --cached --quiet && exit 0
          git commit -m "assets: refresh real NIARIM app captures"
          git push origin HEAD:dev_branch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-captures
          path: |
            _app/build/visual-smoke/webref_*.png
            public/assets/images/app-captures/*
          retention-days: 14
