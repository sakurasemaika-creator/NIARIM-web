name: Hero polish capture

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/hero-polish-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          node tools/dev-server.mjs > /tmp/niarim-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
      - name: Capture all Hero widths
        run: node tests/intermediate-width-home-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-polish-widths
          path: artifacts/intermediate-width-home
          if-no-files-found: error
