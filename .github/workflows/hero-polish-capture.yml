name: Hero polish capture

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/hero-polish-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-http.log
          exit 1
      - name: Capture Japanese Hero widths
        run: node tests/hero-polish-ja-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-polish-widths
          path: artifacts/hero-polish-ja
          if-no-files-found: error
