name: Refreshed website smoke and visual evidence
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/refresh-2026-smoke.yml"
      - "tests/refresh-2026-smoke.mjs"
      - "public/help/index.html"
      - "public/js/help.js"
      - "public/css/pages/help.css"
      - "public/js/i18n-dict-help.js"
      - "tests/help-interaction-audit.mjs"
      - "tests/export-format-guide.mjs"
      - "public/css/pages/features.css"
      - "public/js/i18n-dict-features-diagram.js"
      - "tests/opal-brand-contract.mjs"
      - "tests/i18n-browser-detection-audit.mjs"
      - "tests/community-ranking-visibility-browser.mjs"
      - "tests/*.test.mjs"
      - "tests/mobile-nav-density-alignment-audit.mjs"
      - "tests/account-deletion-browser.mjs"
      - "src/account-deletion.js"
      - "public/account-deletion/**"
      - "public/css/pages/account-deletion.css"
      - "public/js/*account-deletion.js"
      - "public/privacy/index.html"
      - "public/css/pages/community.css"
      - "public/index.html"
      - "public/404.html"
      - "public/features/index.html"
      - "public/community/index.html"
      - "public/premium/index.html"
      - "public/opals/index.html"
      - "public/css/pages/coins.css"
      - "public/js/i18n-dict-opals.js"
      - "public/js/i18n-dict-visitor-copy-goals.js"
      - "public/js/lang-flag.js"
      - "public/js/i18n.js"
      - "public/css/refresh-2026.css"
      - "public/css/niarim-game-site.css"
      - "public/css/brand-direction-2026.css"
      - "public/css/studio-unification-2026.css"
      - "public/assets/images/app-captures/community.webp"
      - "tests/studio-2026-contract.mjs"
      - "tests/studio-2026-browser.mjs"
      - "tests/studio-heading-glyph-contract.mjs"
      - "public/js/brand-direction.js"
      - "tests/brand-direction-contract.mjs"
      - "public/js/pc-paired-captures.js"
      - "public/js/store-release-link.js"
      - "public/js/capture-viewer.js"
      - "public/js/i18n-dict-showcase.js"
      - "public/js/i18n-dict-premium.js"
      - "public/css/pages/premium.css"
      - "public/css/capture-viewer.css"
      - "public/css/common-base.css"
      - "public/js/common-ui.js"
      - "public/js/main.js"
      - "public/assets/fonts/**"
      - "public/js/community.js"
      - "public/js/i18n-dict-community-live.js"
      - "src/community-feed.js"
      - "src/index.js"
      - "public/js/refresh-2026.js"
      - "public/js/i18n-dict-refresh-2026.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-opal-prices:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://niarim.miranima-studio.com/opals/
          - https://niarim-web.niarim.workers.dev/opals/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify prices on the published site
        env:
          OPAL_PRICE_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          price_page="$RUNNER_TEMP/niarim-opal-price.html"
          curl --fail --silent --show-error --location --connect-timeout 10 \
            --max-time 30 --retry 1 --output "$price_page" "$OPAL_PRICE_URL"
          npm run audit:opal -- "$price_page"
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify brand direction contract across public pages
        run: npm run audit:brand-direction
      - name: Verify Opal pricing and comparison rules
        run: npm run audit:opal
      - run: npx playwright install --with-deps chromium
      - name: Run all Web unit tests
        run: node --test tests/*.test.mjs
      - name: Start static site
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-site.log
          exit 1
      - name: Verify Help search and disclosure controls across seven languages
        run: node tests/help-interaction-audit.mjs
      - name: Verify mobile menu focus and scrolling
        run: node tests/mobile-nav-density-alignment-audit.mjs
      - name: Verify initial and saved browser languages
        run: node tests/i18n-browser-detection-audit.mjs
      - name: Verify export format descriptions and contextual guide links
        run: node tests/export-format-guide.mjs
      - name: Verify studio typography and real community capture
        run: |
          node tests/studio-2026-contract.mjs
          node tests/studio-heading-glyph-contract.mjs
      - name: Run language, responsive, image and palette smoke checks
        run: node tests/refresh-2026-smoke.mjs
      - name: Verify editorial fonts, motion and native screenshots in browser
        run: node tests/studio-2026-browser.mjs
      - name: Test in-place redaction of newly private ranked works
        run: node tests/community-ranking-visibility-browser.mjs
      - name: Test Google verification and irreversible deletion confirmation with mock identity
        run: node tests/account-deletion-browser.mjs
      - name: Capture all website pages top-to-bottom, Japanese PC and mobile
        env:
          AUDIT_LANGS: ja
          AUDIT_VIEWPORTS: sp,pc
          AUDIT_FULLPAGE_DIR: artifacts/site-all-pages
        run: |
          npm install --no-save pngjs@7.0.0
          node tests/fullpage-multilang-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-all-pages-japanese-full-height
          path: artifacts/site-all-pages/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refreshed-website-mobile-desktop
          path: |
            artifacts/refresh-2026/
            artifacts/studio-2026/
          if-no-files-found: warn
          retention-days: 14
