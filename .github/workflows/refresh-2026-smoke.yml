name: Refreshed website smoke and visual evidence
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/refresh-2026-smoke.yml"
      - "tests/refresh-2026-smoke.mjs"
      - "public/index.html"
      - "public/features/index.html"
      - "public/community/index.html"
      - "public/premium/index.html"
      - "public/css/refresh-2026.css"
      - "public/css/niarim-game-site.css"
      - "public/js/pc-paired-captures.js"
      - "public/js/store-release-link.js"
      - "public/js/community.js"
      - "public/js/i18n-dict-community-live.js"
      - "src/community-feed.js"
      - "src/index.js"
      - "public/js/refresh-2026.js"
      - "public/js/i18n-dict-refresh-2026.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test live community API proxy with mock upstream
        run: node --test tests/community-feed.test.mjs
      - name: Start static site
        run: |
          python3 -m http.server 8787 --directory public > /tmp/niarim-site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/niarim-site.log
          exit 1
      - name: Run language, responsive, image and palette smoke checks
        run: node tests/refresh-2026-smoke.mjs
      - name: Capture all website pages top-to-bottom, Japanese PC and mobile
        env:
          AUDIT_LANGS: ja
          AUDIT_VIEWPORTS: sp,pc
          AUDIT_FULLPAGE_DIR: artifacts/site-all-pages
        run: |
          npm install --no-save pngjs@7.0.0
          node tests/fullpage-multilang-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-all-pages-japanese-full-height
          path: artifacts/site-all-pages/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refreshed-website-mobile-desktop
          path: artifacts/refresh-2026/
          if-no-files-found: warn
          retention-days: 14
