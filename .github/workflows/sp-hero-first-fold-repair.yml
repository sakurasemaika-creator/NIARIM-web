name: SP Hero first-fold repair

on:
  push:
    branches:
      - dev_branch
    paths:
      - .github/workflows/sp-hero-first-fold-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply repair
        run: python3 tools/repair-sp-hero-first-fold.py
      - name: Format
        run: npx prettier --write public/css/home-hero-responsive-final.css tests/intermediate-width-home-audit.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8787 --directory public > /tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8787/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1
      - name: Verify Hero
        run: AUDIT_HERO_DIR=artifacts/sp-first-fold node tests/intermediate-width-home-audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp-hero-first-fold-repair
          path: artifacts/sp-first-fold/
          if-no-files-found: error
          retention-days: 14
      - name: Commit repair
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/css/home-hero-responsive-final.css tests/intermediate-width-home-audit.mjs
          git commit -m "fix: restore compact SP Hero first fold"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
