name: One-shot full-page evidence paint fix

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/one-shot-fullpage-evidence-paint-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make full-page evidence paint lazy-rendered content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/final-visual-screenshot-audit-v2.mjs')
          s = p.read_text()
          needle = '    document.body.style.scrollBehavior = "auto";\n  });\n\n  let previousHeight = -1;'
          replacement = '''    document.body.style.scrollBehavior = "auto";
            const style = document.createElement("style");
            style.id = "audit-fullpage-paint";
            style.textContent =
              ".section,.feature-section,.screenshot-card{content-visibility:visible!important}";
            document.head.appendChild(style);
          });

          let previousHeight = -1;'''
          if needle not in s:
              raise SystemExit('settleFullPage target not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
          npx prettier --write tests/final-visual-screenshot-audit-v2.mjs
          rm .github/workflows/one-shot-fullpage-evidence-paint-fix.yml
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/final-visual-screenshot-audit-v2.mjs .github/workflows/one-shot-fullpage-evidence-paint-fix.yml
          git commit -m "Make full-page evidence paint lazy content"
          git push origin HEAD:dev_branch
