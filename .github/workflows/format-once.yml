name: One-time canonical formatting

on:
  push:
    branches: [dev_branch]
    paths:
      - docs/work-audit/state/FORMAT_ONCE_TRIGGER.txt

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check one-time trigger
        id: trigger
        run: |
          if [ -f docs/work-audit/state/FORMAT_ONCE_TRIGGER.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.trigger.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.trigger.outputs.exists == 'true'
        run: npm ci
      - name: Format all Prettier-supported tracked files
        if: steps.trigger.outputs.exists == 'true'
        run: npm run format
      - name: Verify canonical formatting
        if: steps.trigger.outputs.exists == 'true'
        run: npm run format:check
      - name: Run contract and unit tests after formatting
        if: steps.trigger.outputs.exists == 'true'
        run: |
          npm run audit:brand-direction
          npm run audit:opal
          node --test tests/*.test.mjs
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/niarim-worker-build"
          git diff --check
      - name: Commit verified formatting to dev_branch
        if: steps.trigger.outputs.exists == 'true'
        run: |
          rm docs/work-audit/state/FORMAT_ONCE_TRIGGER.txt
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: apply canonical Prettier formatting"
          git push origin HEAD:dev_branch
