name: Consolidate Hero ownership and format debt

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/cleanup-hero-ownership-format.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove stale Hero ownership and repair comments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fit = Path('public/css/home-hero-fit-628.css')
          text = fit.read_text()
          marker = '''/* 641–759px is owned by this final Home layer, not by the older tablet/SP
             layers loaded before it. Keep the canonical single Canvas preview beside the
             copy until the deliberate 760px switch to the two-preview tablet layout.
             Higher specificity here is intentional: several legacy rules use !important,
             so source order alone is not enough to prevent a one-column regression. */'''
          if marker not in text:
              raise SystemExit('stale 641–759 ownership block marker changed')
          head, tail = text.split(marker, 1)
          if '@media (min-width: 641px) and (max-width: 759px)' not in tail:
              raise SystemExit('stale ownership media query missing')
          fit.write_text(head.rstrip() + '\n')

          final = Path('public/css/home-hero-responsive-final.css')
          text = final.read_text()
          text = text.replace(
              '''    /* Grow the single-card presentation continuously through the compact band.
                 Ending near 243px at 759px keeps its visual weight close to the two-card
                 tablet presentation instead of making 760px look like a different page. */
            width: clamp(150px, 28vw, 205px) !important;''',
              '''    width: clamp(150px, 28vw, 205px) !important;''',
              1,
          )
          text = text.replace(
              '''    /* Two cards need room, but 320px at the first tablet pixel caused both the
                 copy and artwork to jump. 300px still gives two readable ~147px cards. */
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr) !important;''',
              '''    /* The transition band reaches ~243px at 759px; 320px at 760px keeps the
                 first two-card layout readable while staying below the 35% visual jump cap. */
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr) !important;''',
              1,
          )
          final.write_text(text)
          PY

      - name: Canonicalize known format debt and touched CSS
        run: npx prettier --write docs/product-audit/QUALITY_STANDARD.md docs/work-audit/state/ASTRA_AUDIT_STATE.md docs/work-audit/state/ASTRA_CONTINUATION.md public/css/home-hero-fit-628.css public/css/home-hero-responsive-final.css

      - name: Verify repository formatting is green
        run: npm run format:check

      - name: Commit without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-hero-ownership-format.yml
          git add docs/product-audit/QUALITY_STANDARD.md docs/work-audit/state/ASTRA_AUDIT_STATE.md docs/work-audit/state/ASTRA_CONTINUATION.md public/css/home-hero-fit-628.css public/css/home-hero-responsive-final.css
          git commit -m 'fix: consolidate Hero breakpoint ownership'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
