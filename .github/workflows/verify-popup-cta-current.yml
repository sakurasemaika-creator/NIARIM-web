name: Verify Popup And CTA Regressions

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/verify-popup-cta-current.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused source contracts
        run: |
          node tests/popup-close-affordance-contract.mjs
          node tests/popup-outside-dismiss-contract.mjs
          node tests/home-cta-frame-mode-source-contract.mjs
          node tests/timeline-toolbar-frame-mode-contract.mjs
      - name: Verify formatting
        run: npx prettier --check public/js/popup-mock-interactions.js public/css/popup-close-affordance.css public/index.html public/features/index.html public/faq/index.html public/js/i18n-dict.js tests/popup-close-affordance-contract.mjs tests/popup-outside-dismiss-contract.mjs tests/home-cta-frame-mode-source-contract.mjs tests/timeline-toolbar-frame-mode-contract.mjs
      - name: Remove one-shot workflow after green verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-popup-cta-current.yml
          git commit -m "ci: remove popup and CTA verification workflow"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
