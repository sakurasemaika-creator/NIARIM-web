name: One-time Home Community formatter

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/format-home-community-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format Home Community changes
        run: >-
          npx prettier --write
          public/js/home-hero-showcase.js
          public/css/home-community-spacing.css
          tests/home-community-spacing-audit.mjs
          .github/workflows/home-width-sweep.yml
      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/home-hero-showcase.js public/css/home-community-spacing.css tests/home-community-spacing-audit.mjs .github/workflows/home-width-sweep.yml
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format Home Community updates"
            git push origin HEAD:dev_branch
          fi
