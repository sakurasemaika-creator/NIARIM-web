name: One-shot trigger visual audit 2

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-trigger-visual-audit-2.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger visual interaction audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" --jq '.workflows[] | select(.name=="Visual interaction audit") | .id' | head -n1)
          test -n "$WORKFLOW_ID"
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/dispatches" -f ref=dev_branch

      - name: Remove one-shot trigger workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout dev_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-trigger-visual-audit.yml .github/workflows/one-shot-trigger-visual-audit-2.yml
          git commit -m "Remove one-shot visual audit triggers"
          git push origin dev_branch
