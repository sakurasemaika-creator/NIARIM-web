name: CTA copy TDD 20260914
on:
  push:
    paths:
      - '.github/workflows/cta-copy-tdd-20260914.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/popup-close-frame-mode-20260914
      - name: Add regression first and verify RED
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/mock-ui-source-regression.mjs')
          s=p.read_text()
          marker="console.log('mock-ui-source-regression: ok');"
          block=r'''
const i18nSource = fs.readFileSync('public/js/i18n-dict.js', 'utf8');
const homeSource = fs.readFileSync('public/index.html', 'utf8');
const faqSource = fs.readFileSync('public/faq/index.html', 'utf8');
const ctaTitle = '実際にアニメーションを つくってみよう！';
const ctaBody = '描きたいと思ったら今すぐにでも始められる。全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。';
assert.ok(i18nSource.includes(`"cta.title": "${ctaTitle}"`), 'Japanese CTA title must match approved copy');
assert.ok(i18nSource.includes(`"cta.body": "${ctaBody}"`), 'Japanese CTA body must match approved copy');
for (const [name, html] of [['home', homeSource], ['faq', faqSource]]) {
  assert.ok(html.includes(`data-i18n="cta.title">${ctaTitle}</h2>`), `${name} fallback CTA title must match dictionary`);
  assert.ok(html.includes(ctaBody), `${name} fallback CTA body must match dictionary`);
}

'''
          if 'const ctaTitle =' not in s:
              s=s.replace(marker, block+marker)
              p.write_text(s)
          PY
          if node tests/mock-ui-source-regression.mjs; then
            echo 'Expected RED but regression unexpectedly passed' >&2
            exit 1
          fi
      - name: Apply approved CTA copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old_title='あなたの物語を、動かそう。'
          old_body='NIARIMで、次のアニメーション作品をはじめましょう。'
          new_title='実際にアニメーションを つくってみよう！'
          new_body='描きたいと思ったら今すぐにでも始められる。全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'
          for name in ['public/js/i18n-dict.js','public/index.html','public/faq/index.html']:
              p=Path(name); s=p.read_text()
              if old_title not in s or old_body not in s:
                  raise SystemExit(f'expected old CTA copy not found in {name}')
              s=s.replace(old_title,new_title).replace(old_body,new_body)
              p.write_text(s)
          PY
      - name: Verify GREEN
        run: node tests/mock-ui-source-regression.mjs
      - name: Commit product and regression changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/i18n-dict.js public/index.html public/faq/index.html tests/mock-ui-source-regression.mjs
          git commit -m 'feat(web): simplify frame switch and refresh CTA copy'
          git push origin HEAD:fix/popup-close-frame-mode-20260914
