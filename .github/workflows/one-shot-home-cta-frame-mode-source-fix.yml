name: One-shot home CTA and frame mode source fix

on:
  push:
    branches:
      - dev_branch
    paths:
      - .github/workflows/one-shot-home-cta-frame-mode-source-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write regression contract test
        shell: bash
        run: |
          cat > tests/home-cta-frame-mode-source-contract.mjs <<'EOF'
          import fs from "node:fs/promises";

          const [main, baseCss, finalCss, dict, home, faq, finishCss] =
            await Promise.all([
              fs.readFile("public/js/main.js", "utf8"),
              fs.readFile("public/css/screen-mock-accuracy-base.css", "utf8"),
              fs.readFile("public/css/ui-regression-fixes.css", "utf8"),
              fs.readFile("public/js/i18n-dict.js", "utf8"),
              fs.readFile("public/index.html", "utf8"),
              fs.readFile("public/faq/index.html", "utf8"),
              fs.readFile("public/css/visual-finish.css", "utf8"),
            ]);

          const title = "実際にアニメーションを つくってみよう！";
          const body =
            "描きたいと思ったら今すぐにでも始められる。全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。";
          const failures = [];
          const expect = (ok, message) => {
            if (!ok) failures.push(message);
          };

          expect(
            /class=\\"fd-frame-mode\\"[^>]*aria-label=\\"タイムライン\\"[^>]*data-i18n-attr=\\"aria-label:fd\.timelineMode\\"[\\s\\S]*?icon\(\\"ic-movie_filter\\"\)/.test(
              main,
            ),
            "Dynamic canvas frame-mode control must be an accessible button using the existing ic-movie_filter sprite icon",
          );
          expect(
            !main.includes("<span class=\\\"fd-frame-mode\\\"><span class=\\\"is-selected\\\"") &&
              !main.includes("data-i18n=\\\"fd.frameListMode\\\">フレーム一覧</span><span"),
            "Dynamic frame-mode control must not keep the legacy two visible text segments",
          );
          expect(
            /\.fd-frame-mode\s*\{[\s\S]*?width:\s*42px\s*!important[\s\S]*?height:\s*42px\s*!important[\s\S]*?flex:\s*0\s+0\s+42px\s*!important[\s\S]*?border-radius:\s*50%\s*!important/.test(
              baseCss,
            ),
            "Canonical frame-mode CSS must define a 42px circular control",
          );
          expect(
            !/\.fd-frame-mode\s*\{[\s\S]*?grid-template-columns:\s*1fr\s+1fr/.test(
              baseCss,
            ) && !baseCss.includes(".fd-frame-mode > span + span"),
            "Canonical frame-mode CSS must not retain the segmented-pill split layout",
          );
          expect(
            !finalCss.includes(".fd-frame-mode::before") &&
              !finalCss.includes("mask-image: url(\"data:image/svg+xml"),
            "Final regression layer must not synthesize movie_filter with a pseudo-element mask",
          );

          expect(
            dict.includes(`\"cta.title\": \"${title}\"`) &&
              dict.includes(`\"cta.body\": \"${body}\"`),
            "Japanese shared CTA dictionary must contain the requested title and body",
          );
          for (const [name, html] of [
            ["home", home],
            ["faq", faq],
          ]) {
            expect(
              html.includes(`data-i18n=\"cta.title\">${title}</`) &&
                html.includes(body),
              `${name} fallback CTA must match the requested Japanese copy`,
            );
          }
          expect(
            !home.includes("feature-narrative") &&
              !home.includes("narrative.home.cta.heading") &&
              !home.includes("narrative.home.cta.body"),
            "Home must not retain the duplicate feature-narrative CTA block",
          );
          expect(
            !home.includes("fd-frame-strip-mode") &&
              (home.match(/class=\"fd-frame-mode\"/g) || []).length >= 2 &&
              /class=\"fd-frame-mode\"[\s\S]*?sprite\.svg#ic-movie_filter/.test(home),
            "Static home canvas fallbacks must use circular fd-frame-mode controls with the movie_filter sprite",
          );
          expect(
            !finishCss.includes(".site-footer::before") &&
              !/repeating-linear-gradient\(\s*90deg[\s\S]*?var\(--color-accent\)/.test(
                finishCss,
              ),
            "Footer stripe pseudo-element must stay removed",
          );

          if (failures.length) {
            console.error(JSON.stringify({ ok: false, failures }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ ok: true }, null, 2));
          EOF

      - name: Verify RED before production changes
        shell: bash
        run: |
          set +e
          node tests/home-cta-frame-mode-source-contract.mjs 2>&1 | tee /tmp/home_contract_red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression contract unexpectedly passed before production changes.'
            exit 1
          fi
          grep -q 'Dynamic canvas frame-mode control' /tmp/home_contract_red.log
          grep -q 'Japanese shared CTA dictionary' /tmp/home_contract_red.log
          grep -q 'Home must not retain the duplicate feature-narrative CTA block' /tmp/home_contract_red.log
          echo 'RED confirmed.'

      - name: Apply canonical source fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          TITLE = '実際にアニメーションを つくってみよう！'
          BODY = '描きたいと思ったら今すぐにでも始められる。全フレーム手描きでもキーフレームアニメーションでもあなたのお好みで。納得するまでとことんこだわってあなただけのオリジナル作品をつくろう。完成したら作品広場でみんなにみてもらうことができます。逆に、他の人の作品をみることもできます。つくって、公開して、みつけよう。'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Shared Japanese CTA dictionary.
          p = Path('public/js/i18n-dict.js')
          s = p.read_text()
          s = replace_once(s, '"cta.title": "あなたの物語を、動かそう。",', f'"cta.title": "{TITLE}",', 'cta.title dictionary')
          s = replace_once(s, '"cta.body": "NIARIMで、次のアニメーション作品をはじめましょう。",', f'"cta.body": "{BODY}",', 'cta.body dictionary')
          p.write_text(s)

          # Dynamic canvas mock uses the actual existing sprite icon and keeps an a11y label.
          p = Path('public/js/main.js')
          s = p.read_text()
          old = '<span class="fd-frame-mode"><span class="is-selected" data-i18n="fd.frameListMode">フレーム一覧</span><span data-i18n="fd.timelineMode">タイムライン</span></span>'
          new = '<button type="button" class="fd-frame-mode" aria-label="タイムライン" data-i18n-attr="aria-label:fd.timelineMode" tabindex="-1">' + "' +\n      icon(\"ic-movie_filter\") +\n      '" + '</button>'
          s = replace_once(s, old, new, 'dynamic frame-mode markup')
          p.write_text(s)

          # Canonical CSS: remove the old 117x42 segmented control at the source.
          p = Path('public/css/screen-mock-accuracy-base.css')
          s = p.read_text()
          pattern = re.compile(r'\.fd-frame-mode \{.*?\.fd-frame-mode \.is-selected \{.*?\}\n', re.S)
          replacement = '''.fd-frame-mode {
            width: 42px !important;
            height: 42px !important;
            min-width: 42px !important;
            min-height: 42px !important;
            flex: 0 0 42px !important;
            display: grid !important;
            place-items: center !important;
            padding: 0 !important;
            border: 1px solid var(--fd-panel-2, rgba(40, 36, 44, 0.24)) !important;
            border-radius: 50% !important;
            overflow: hidden !important;
            background: var(--fd-surface) !important;
            color: var(--fd-muted, #6f6064) !important;
          }
          .fd-frame-mode .ic {
            width: 21px !important;
            height: 21px !important;
          }
          '''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'canonical frame-mode CSS: expected one block, found {count}')
          p.write_text(s)

          # Final layer keeps placement geometry only; icon comes from sprite.svg in DOM.
          p = Path('public/css/ui-regression-fixes.css')
          s = p.read_text()
          pattern = re.compile(r'html body \.fd-canvas-screen \.fd-frame-mode \{.*?\n\}\nhtml body \.fd-canvas-screen \.fd-frame-mode > span \{.*?\n\}\n/\* Same geometry.*?html body \.fd-canvas-screen \.fd-frame-mode::before \{.*?\n\}\n', re.S)
          replacement = '''html body .fd-canvas-screen .fd-frame-mode {
            display: grid !important;
            place-items: center !important;
            position: relative !important;
            z-index: 7 !important;
            width: 42px !important;
            height: 42px !important;
            min-width: 42px !important;
            min-height: 42px !important;
            flex: 0 0 42px !important;
            margin-inline: 6px !important;
            padding: 0 !important;
            border-radius: 50% !important;
          }
          html body .fd-canvas-screen .fd-frame-mode .ic {
            width: 21px !important;
            height: 21px !important;
          }
          '''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'final frame-mode CSS: expected one block, found {count}')
          p.write_text(s)

          # Home fallback: remove duplicate narrative CTA; sync final CTA; replace legacy text controls.
          p = Path('public/index.html')
          s = p.read_text()
          narrative = re.compile(r'\n\s*<section class="section">\s*<div class="container">\s*<div class="feature-narrative">\s*<div class="feature-narrative-block">\s*<h3 data-i18n-html="narrative\.home\.cta\.heading">.*?</section>\s*', re.S)
          s, count = narrative.subn('\n\n      ', s, count=1)
          if count != 1:
              raise SystemExit(f'home feature-narrative removal: expected one block, found {count}')
          s = replace_once(s, '<h2 data-i18n="cta.title">あなたの物語を、動かそう。</h2>', f'<h2 data-i18n="cta.title">{TITLE}</h2>', 'home fallback title')
          s = replace_once(s, 'NIARIMで、次のアニメーション作品をはじめましょう。', BODY, 'home fallback body')
          legacy = re.compile(r'<span class="fd-frame-strip-mode" data-i18n="fd\.frameListMode"\s*>\s*フレーム一覧</span\s*>', re.S)
          button = '''<button
                    type="button"
                    class="fd-frame-mode"
                    aria-label="タイムライン"
                    data-i18n-attr="aria-label:fd.timelineMode"
                    tabindex="-1"
                  >
                    <svg class="ic" aria-hidden="true">
                      <use
                        href="/assets/icons/ui/sprite.svg#ic-movie_filter"
                      ></use>
                    </svg>
                  </button>'''
          s, count = legacy.subn(button, s)
          if count < 2:
              raise SystemExit(f'static frame-mode markup: expected at least two legacy controls, found {count}')
          p.write_text(s)

          # FAQ no-JS fallback.
          p = Path('public/faq/index.html')
          s = p.read_text()
          s = replace_once(s, '<h2 data-i18n="cta.title">あなたの物語を、動かそう。</h2>', f'<h2 data-i18n="cta.title">{TITLE}</h2>', 'faq fallback title')
          s = replace_once(s, 'NIARIMで、次のアニメーション作品をはじめましょう。', BODY, 'faq fallback body')
          p.write_text(s)

          # Existing frame-mode contract now checks the real sprite rather than the deleted pseudo-mask.
          p = Path('tests/timeline-toolbar-frame-mode-contract.mjs')
          s = p.read_text()
          old = '''expectMatch(
            finalCss,
            /\\.fd-frame-mode::before\\s*\\{[\\s\\S]*?mask-image:[\\s\\S]*?M18%204l2%204/,
            "Frame strip mode control must use the existing movie_filter clapperboard icon geometry",
          );
          expectMatch(
            finalCss,
            /\\.fd-frame-mode\\s*>\\s*span\\s*\\{[\\s\\S]*?display:\\s*none\\s*!important/,
            "Frame strip mode control must hide the legacy two text segments",
          );'''
          new = '''expectMatch(
            main,
            /class=\\"fd-frame-mode\\"[\\s\\S]*?aria-label=\\"タイムライン\\"[\\s\\S]*?icon\\(\\"ic-movie_filter\\"\\)/,
            "Frame strip mode control must use the existing movie_filter sprite with an accessibility label",
          );
          if (finalCss.includes(".fd-frame-mode::before")) {
            failures.push("Frame strip mode control must not synthesize the icon with a pseudo-element mask");
          }'''
          s = replace_once(s, old, new, 'existing frame-mode contract')
          p.write_text(s)
          PY

      - name: Format changed sources
        run: npx prettier --write public/js/main.js public/js/i18n-dict.js public/css/screen-mock-accuracy-base.css public/css/ui-regression-fixes.css public/index.html public/faq/index.html tests/home-cta-frame-mode-source-contract.mjs tests/timeline-toolbar-frame-mode-contract.mjs

      - name: Verify GREEN contracts
        run: |
          node tests/home-cta-frame-mode-source-contract.mjs
          node tests/timeline-toolbar-frame-mode-contract.mjs
          node tests/final-visual-invariants-audit-v2.mjs
          npx prettier --check public/js/main.js public/js/i18n-dict.js public/css/screen-mock-accuracy-base.css public/css/ui-regression-fixes.css public/index.html public/faq/index.html tests/home-cta-frame-mode-source-contract.mjs tests/timeline-toolbar-frame-mode-contract.mjs

      - name: Commit and push verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/main.js public/js/i18n-dict.js public/css/screen-mock-accuracy-base.css public/css/ui-regression-fixes.css public/index.html public/faq/index.html tests/home-cta-frame-mode-source-contract.mjs tests/timeline-toolbar-frame-mode-contract.mjs
          git diff --cached --check
          git commit -m "fix: canonicalize home CTA and frame mode source"
          git pull --rebase origin dev_branch
          node tests/home-cta-frame-mode-source-contract.mjs
          node tests/timeline-toolbar-frame-mode-contract.mjs
          git push origin HEAD:dev_branch
