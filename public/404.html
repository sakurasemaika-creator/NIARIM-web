<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ページが見つかりません | NIARIM</title>
<meta name="robots" content="noindex,follow" />

<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/css/reset.css" />
<link rel="stylesheet" href="/css/variables.css" />
<link rel="stylesheet" href="/css/common.css" />
<style>
  .error-page {
    min-height: calc(100svh - var(--header-height));
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--space-xl) var(--container-padding);
  }
  .error-page .eyebrow {
    display: block;
    font-family: var(--font-serif);
    font-size: 5rem;
    font-weight: 700;
    color: var(--color-sub);
    margin-bottom: var(--space-sm);
  }
  .error-page h1 {
    font-size: var(--fs-h1);
    margin-bottom: var(--space-sm);
  }
  .error-page p {
    color: var(--color-text-muted);
    max-width: 44ch;
    margin-inline: auto;
    margin-bottom: var(--space-lg);
  }
</style>
</head>
<body data-i18n-title="meta.404.title">
<a class="skip-link" href="#main">本文へスキップ</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <img src="/assets/images/logo/app_logo.svg" alt="NIARIM" width="32" height="32" />
      <span>NIARIM</span>
    </a>
    <nav class="main-nav" aria-label="グローバルナビゲーション">
      <ul>
        <li><a href="/features/" data-i18n="nav.features">機能</a></li>
        <li><a href="/news/" data-i18n="nav.news">お知らせ</a></li>
        <li><a href="/#faq" data-i18n="nav.faq">よくある質問</a></li>
        <li><a href="/contact/" data-i18n="nav.contact">お問い合わせ</a></li>
      </ul>
      <div class="lang-dropdown" data-lang-dropdown data-open="false">
        <button type="button" class="lang-trigger" data-lang-trigger data-i18n-attr="aria-label:lang.switch">
          <span data-current-lang-label>日本語</span>
        </button>
        <ul class="lang-menu" data-lang-menu></ul>
      </div>
      <a class="btn btn-accent" href="/#download" data-i18n="nav.download">ダウンロード</a>
    </nav>
    <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="main-nav">
      <span class="bar"></span>
    </button>
  </div>
</header>

<main id="main">
  <div class="error-page">
    <div>
      <span class="eyebrow" data-i18n="error404.eyebrow">404</span>
      <h1 data-i18n="error404.title">このフレームは見つかりませんでした。</h1>
      <p data-i18n="error404.body">お探しのページは、移動または削除された可能性があります。URLをご確認いただくか、ホームからやり直してください。</p>
      <a class="btn btn-primary" href="/" data-i18n="error404.cta">ホームへ戻る</a>
    </div>
  </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/i18n-dict.js"></script>
<script src="/js/i18n-dict-intl.js"></script>
<script src="/js/i18n-dict-legal.js"></script>
<script src="/js/i18n-dict-advanced.js"></script>
<script src="/js/i18n-dict-faq-fix.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
