<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="NIARIM app icon">\n  <rect x="0" y="0" width="1200" height="1200" rx="200" ry="200" fill="#FF5C7A"/>\n  <g transform="translate(294.453 168.000) scale(1.520137) translate(-399 -328.63)">\n  <g fill="#FFFFFF" fill-rule="evenodd">\n\n    <defs>\n      <mask id="penClearance" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="1200">\n        <rect width="1200" height="1200" fill="white"/>\n\n        <!-- 斜めのペン本体：先端側の境界を1本の直線に修正 -->\n        <path\n          d="M 521 377\n             L 456 411\n             L 693 845\n             L 758.21301666 809.38828353\n             Z"\n          fill="black"\n          stroke="black"\n          stroke-width="40"\n          stroke-linecap="round"\n          stroke-linejoin="round"\n        />\n\n        <!-- 斜めのペン中央：楕円形ボタンの抜き -->\n        <ellipse\n          cx="690.5"\n          cy="763.5"\n          rx="31"\n          ry="17"\n          transform="rotate(61.4 690.5 763.5)"\n          fill="black"\n        />\n\n        <!--\n          ペン上部：\n          元の底辺はそのまま。\n          左右の辺の角度と幅を維持したまま長さだけ短縮。\n          上辺と、それを直径とする半円を一体で下方向へ移動。\n        -->\n        <path\n          d="M 447 394\n             L 513 360\n             L 495.64 328.63\n             A 36.91205765 36.91205765 0 0 0 430.01 362.44\n             Z"\n          fill="black"\n          stroke="black"\n          stroke-width="40"\n          stroke-linecap="round"\n          stroke-linejoin="round"\n        />\n\n        <!--\n          右下パーツ：先端の四角形部分。\n          本体側の辺を中央に角のない1本の直線に変更。\n          本体側の境界線と平行になるよう調整。\n        -->\n        <path\n          d="M 765.86070378 823.32837144\n             L 700.62053982 858.95491259\n             L 759.37 889.78\n             Z"\n          fill="black"\n          stroke="black"\n          stroke-width="40"\n          stroke-linecap="round"\n          stroke-linejoin="round"\n        />\n\n        <!-- 右下パーツ：細い突起部分 -->\n        <path\n          d="M 747 881\n             L 757 897\n             L 767 893\n             L 761 880\n             Z"\n          fill="black"\n          stroke="black"\n          stroke-width="40"\n          stroke-linecap="round"\n          stroke-linejoin="round"\n        />\n      </mask>\n\n      <!--\n        ペン本体専用のボタンくり抜きマスク。\n        白部分＝ペン本体を表示、\n        黒い楕円部分＝ペン本体を透明化。\n      -->\n      <mask id="buttonClearance" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="1200">\n        <rect width="1200" height="1200" fill="white"/>\n        <ellipse\n          cx="690.5"\n          cy="763.5"\n          rx="31"\n          ry="17"\n          transform="rotate(61.4 690.5 763.5)"\n          fill="black"\n        />\n      </mask>\n    </defs>\n\n    <g mask="url(#penClearance)">\n\n      <!-- 左側の縦長フレーム：変更なし -->\n      <path\n        d="M 416 377 H 496 Q 513 377 513 394 V 806 Q 513 823 496 823 H 416 Q 399 823 399 806 V 394 Q 399 377 416 377 Z M 434.000000 431.000000 H 470.000000 Q 476.000000 431.000000 476.000000 437.000000 V 467.000000 Q 476.000000 473.000000 470.000000 473.000000 H 440.000000 Q 434.000000 473.000000 434.000000 467.000000 V 437.000000 Q 434.000000 431.000000 440.000000 431.000000 Z M 434.000000 505.000000 H 470.000000 Q 476.000000 505.000000 476.000000 511.000000 V 541.000000 Q 476.000000 547.000000 470.000000 547.000000 H 440.000000 Q 434.000000 547.000000 434.000000 541.000000 V 511.000000 Q 434.000000 505.000000 440.000000 505.000000 Z M 434.000000 579.000000 H 470.000000 Q 476.000000 579.000000 476.000000 585.000000 V 615.000000 Q 476.000000 621.000000 470.000000 621.000000 H 440.000000 Q 434.000000 621.000000 434.000000 615.000000 V 585.000000 Q 434.000000 579.000000 440.000000 579.000000 Z M 434.000000 653.000000 H 470.000000 Q 476.000000 653.000000 476.000000 659.000000 V 689.000000 Q 476.000000 695.000000 470.000000 695.000000 H 440.000000 Q 434.000000 695.000000 434.000000 689.000000 V 659.000000 Q 434.000000 653.000000 440.000000 653.000000 Z M 434.000000 727.000000 H 470.000000 Q 476.000000 727.000000 476.000000 733.000000 V 763.000000 Q 476.000000 769.000000 470.000000 769.000000 H 440.000000 Q 434.000000 769.000000 434.000000 763.000000 V 733.000000 Q 434.000000 727.000000 440.000000 727.000000 Z"\n      />\n\n      <!-- 右側の縦長フレーム：変更なし -->\n      <path\n        d="M 705 377 H 784 Q 801 377 801 394 V 806 Q 801 823 784 823 H 705 Q 688 823 688 806 V 394 Q 688 377 705 377 Z M 722.000000 431.000000 H 758.000000 Q 764.000000 431.000000 764.000000 437.000000 V 467.000000 Q 764.000000 473.000000 758.000000 473.000000 H 728.000000 Q 722.000000 473.000000 722.000000 467.000000 V 437.000000 Q 722.000000 431.000000 728.000000 431.000000 Z M 722.000000 505.000000 H 758.000000 Q 764.000000 505.000000 764.000000 511.000000 V 541.000000 Q 764.000000 547.000000 758.000000 547.000000 H 728.000000 Q 722.000000 547.000000 722.000000 541.000000 V 511.000000 Q 722.000000 505.000000 728.000000 505.000000 Z M 722.000000 579.000000 H 758.000000 Q 764.000000 579.000000 764.000000 585.000000 V 615.000000 Q 764.000000 621.000000 758.000000 621.000000 H 728.000000 Q 722.000000 621.000000 722.000000 615.000000 V 585.000000 Q 722.000000 579.000000 728.000000 579.000000 Z M 722.000000 653.000000 H 758.000000 Q 764.000000 653.000000 764.000000 659.000000 V 689.000000 Q 764.000000 695.000000 758.000000 695.000000 H 728.000000 Q 722.000000 695.000000 722.000000 689.000000 V 659.000000 Q 722.000000 653.000000 728.000000 653.000000 Z M 722.000000 727.000000 H 758.000000 Q 764.000000 727.000000 764.000000 733.000000 V 763.000000 Q 764.000000 769.000000 758.000000 769.000000 H 728.000000 Q 722.000000 769.000000 722.000000 763.000000 V 733.000000 Q 722.000000 727.000000 728.000000 727.000000 Z"\n      />\n\n    </g>\n\n    <!--\n      斜めのペン本体：\n      ボタン位置だけ透明にくり抜く。\n      それ以外の形状・座標は変更なし。\n    -->\n    <path\n      d="M 521 377\n         L 456 411\n         L 693 845\n         L 758.21301666 809.38828353\n         Z"\n      mask="url(#buttonClearance)"\n    />\n\n    <!--\n      ボタンはここでは描画しない。\n      buttonClearance によってペン本体そのものが透明にくり抜かれている。\n    -->\n\n    <!--\n      ペン上部：\n      四角形を短縮し、\n      底辺と完全に平行な上辺＋正確な半円を連動して移動。\n    -->\n    <path\n      d="M 447 394\n         L 513 360\n         L 495.64 328.63\n         A 36.91205765 36.91205765 0 0 0 430.01 362.44\n         Z"\n    />\n\n    <!--\n      右下パーツ：先端の四角形部分。\n      本体との境界を中央に角のない直線に変更。\n      ペン本体側の境界と平行、かつペンの長手方向に垂直。\n    -->\n    <path\n      d="M 765.86070378 823.32837144\n         L 700.62053982 858.95491259\n         L 759.37 889.78\n         Z"\n    />\n\n    <!-- 右下パーツ：細い突起部分 -->\n    <path\n      d="M 747 881\n         L 757 897\n         L 767 893\n         L 761 880\n         Z"\n    />\n\n  </g>\n\n  </g>\n</svg>\n